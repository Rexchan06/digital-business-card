<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chan Zi Hao - Digital Business Card</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gray: { 850: '#1f2937' } // Custom dark shade for better contrast
                    }
                }
            }
        }
    </script>

    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Smooth tap highlight removal for mobile */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <!-- Main Card Container -->
    <main class="w-full max-w-sm bg-white dark:bg-gray-800 rounded-3xl shadow-xl border border-gray-200 dark:border-gray-700 overflow-hidden relative">
        
        <!-- Dark Mode Toggle -->
        <button id="theme-toggle" class="absolute top-5 right-5 p-2 rounded-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors focus:outline-none">
            <!-- Sun Icon (shows in dark mode) -->
            <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4.22 2.32a1 1 0 011.415 0l.707.707a1 1 0 01-1.414 1.415l-.707-.707a1 1 0 010-1.415zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zm-2.32 4.22a1 1 0 010 1.415l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.415 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm-4.22-2.32a1 1 0 01-1.415 0l-.707-.707a1 1 0 011.414-1.415l.707.707a1 1 0 010 1.415zM2 10a1 1 0 011-1h1a1 1 0 110 2H3a1 1 0 01-1-1zm2.32-4.22a1 1 0 010-1.415l.707-.707a1 1 0 011.414 1.415l-.707.707a1 1 0 01-1.415 0zM10 5a5 5 0 100 10 5 5 0 000-10z" clip-rule="evenodd"></path>
            </svg>
            <!-- Moon Icon (shows in light mode) -->
            <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-gray-500" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
        </button>

        <!-- Header Section (Typography Driven) -->
        <div class="px-8 pt-12 pb-8 text-center border-b border-gray-100 dark:border-gray-700">
            <h1 class="text-3xl font-bold tracking-tight mb-1">Chan Zi Hao</h1>
            <p class="text-sm font-medium text-gray-500 dark:text-gray-400 tracking-wide uppercase">Software & Cloud Engineering</p>
        </div>

        <div class="p-6 space-y-6">
            
            <!-- Primary CTA: Save to Contacts -->
            <a href="./contact.vcf" class="w-full bg-gray-900 dark:bg-white text-white dark:text-gray-900 font-semibold py-3.5 rounded-xl shadow-md hover:bg-gray-800 dark:hover:bg-gray-100 active:scale-95 transition-all flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Save Contact
            </a>

            <!-- Quick Action Grid (WhatsApp & LinkedIn) -->
            <div class="grid grid-cols-2 gap-4">
                <!-- WhatsApp -->
                <a id="wa-link" href="#" target="_blank" class="flex flex-col items-center justify-center gap-2 bg-[#25D366] text-white p-4 rounded-xl shadow-sm active:scale-95 transition-transform">
                    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 21.033c-1.87 0-3.69-.5-5.3-1.446l-.379-.225-3.94 1.032 1.055-3.84-.247-.393c-.985-1.57-1.503-3.39-1.503-5.26 0-5.462 4.446-9.91 9.914-9.91 2.646 0 5.132 1.031 7.004 2.905 1.87 1.874 2.903 4.362 2.903 7.012 0 5.46-4.448 9.907-9.907 9.907zm5.437-7.442c-.298-.149-1.764-.871-2.037-.97-.272-.1-.47-.149-.668.149-.199.299-.77 .97-.942 1.168-.173.199-.347.224-.645.075-2.008-.988-3.32-2.115-4.58-4.288-.172-.298.016-.435.151-.577.202-.213.435-.55.603-.79.13-.19.18-.328.27-.55.088-.223.044-.417-.03-.566-.075-.149-.668-1.611-.916-2.206-.24-.582-.486-.503-.668-.512l-.57-.01c-.198 0-.52.075-.793.372-.272.298-1.04 1.016-1.04 2.478 0 1.462 1.065 2.875 1.213 3.073.149.199 2.096 3.198 5.081 4.485 2.098.905 2.766.86 3.255.772.544-.099 1.764-.72 2.012-1.417.248-.697.248-1.295.173-1.417-.074-.124-.271-.198-.569-.347z"/></svg>
                    <span class="text-sm font-medium">WhatsApp</span>
                </a>
                <!-- LinkedIn -->
                <a id="linkedin-link" href="#" target="_blank" class="flex flex-col items-center justify-center gap-2 bg-[#0077b5] text-white p-4 rounded-xl shadow-sm active:scale-95 transition-transform">
                    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
                    <span class="text-sm font-medium">LinkedIn</span>
                </a>
            </div>

            <!-- Standard Contact Links -->
            <div class="space-y-3">
                <a id="phone-link" href="#" class="flex items-center gap-4 p-4 rounded-xl bg-gray-50 dark:bg-gray-850 hover:bg-gray-100 dark:hover:bg-gray-700 active:scale-[0.98] transition-all border border-transparent dark:border-gray-700">
                    <div class="bg-white dark:bg-gray-800 p-2 rounded-lg shadow-sm">
                        <svg class="w-5 h-5 text-gray-700 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="text-xs text-gray-500 dark:text-gray-400">Mobile</p>
                        <p id="phone-display" class="text-sm font-semibold text-gray-900 dark:text-gray-100"></p>
                    </div>
                </a>

                <a id="email-link" href="#" class="flex items-center gap-4 p-4 rounded-xl bg-gray-50 dark:bg-gray-850 hover:bg-gray-100 dark:hover:bg-gray-700 active:scale-[0.98] transition-all border border-transparent dark:border-gray-700">
                    <div class="bg-white dark:bg-gray-800 p-2 rounded-lg shadow-sm">
                        <svg class="w-5 h-5 text-gray-700 dark:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <div class="flex-1 text-left">
                        <p class="text-xs text-gray-500 dark:text-gray-400">Email</p>
                        <p id="email-display" class="text-sm font-semibold text-gray-900 dark:text-gray-100 truncate"></p>
                    </div>
                </a>
            </div>

            <!-- ========================================== -->
            <!-- OPTIONAL LINKS SECTION                     -->
            <!-- Comment out this entire div to hide them.  -->
            <!-- ========================================== -->
            
            <div style="display: none;">
            <div id="optional-links" class="pt-2">
                <p class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-3 px-1">Professional & Projects</p>
                
                <div class="grid gap-3">
                    <!-- Portfolio -->
                    <a id="portfolio-link" href="#" target="_blank" class="flex items-center justify-between p-4 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-[0.98] transition-all">
                        <div class="flex items-center gap-3">
                            <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path></svg>
                            <span class="text-sm font-medium">Personal Portfolio</span>
                        </div>
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </a>

                    <!-- GitHub -->
                    <a id="github-link" href="#" target="_blank" class="flex items-center justify-between p-4 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-[0.98] transition-all">
                        <div class="flex items-center gap-3">
                            <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                            <span class="text-sm font-medium">GitHub Profile</span>
                        </div>
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </a>

                    <!-- Resume -->
                    <a id="resume-link" href="#" target="_blank" class="flex items-center justify-between p-4 rounded-xl border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-[0.98] transition-all">
                        <div class="flex items-center gap-3">
                            <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            <span class="text-sm font-medium">View Resume</span>
                        </div>
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </a>
                </div>
            </div>
            </div>
            <!-- ========================================== -->
            <!-- END OF OPTIONAL LINKS SECTION              -->
            <!-- ========================================== -->

        </div>
    </main>

    <script>
        // ==========================================
        // 1. YOUR DATA CONFIGURATION
        // ==========================================
        const userData = {
            name: "Chan Zi Hao",
            title: "Software & Cloud Engineering",
            phoneRaw: "60124763772", // Numbers only, include country code (e.g. 60 for Malaysia)
            phoneDisplay: "+60 12-476 3772", // How it appears on the screen
            email: "rexchan06@gmail.com",
            linkedin: "https://linkedin.com/in/zi-hao-chan-319101215",
            github: "https://github.com/Rexchan06",
            portfolio: "https://yourportfolio.com",
            resume: "https://link-to-your-resume.pdf", // Can be a Google Drive link or Netlify hosted PDF
            whatsappMessage: "Hi Zi Hao! I just got your contact from your NFC card. Great connecting with you!\n\nI'm [Name] from [Company]!"
        };

        // ==========================================
        // 2. POPULATE THE DOM
        // ==========================================
        document.getElementById('phone-display').innerText = userData.phoneDisplay;
        document.getElementById('phone-link').href = `tel:+${userData.phoneRaw}`;
        
        document.getElementById('email-display').innerText = userData.email;
        document.getElementById('email-link').href = `mailto:${userData.email}`;
        
        document.getElementById('linkedin-link').href = userData.linkedin;
        
        // Encode WhatsApp Message
        const encodedWaMessage = encodeURIComponent(userData.whatsappMessage);
        document.getElementById('wa-link').href = `https://wa.me/${userData.phoneRaw}?text=${encodedWaMessage}`;

        // Populate Optional Links
        document.getElementById('github-link').href = userData.github;
        document.getElementById('portfolio-link').href = userData.portfolio;
        document.getElementById('resume-link').href = userData.resume;

        // ==========================================
        // 3. DARK MODE TOGGLE LOGIC
        // ==========================================
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        // Check local storage or system preference on load
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            lightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            darkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            // Toggle icons
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');

            // Toggle logic
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });
    </script>
</body>
</html>
